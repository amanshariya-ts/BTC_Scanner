exchange:
  name: binanceusdm
  api_key: ""
  secret: ""

# Every market (symbol + timeframe combo) to watch in parallel
markets:
  - symbol: "BTC/USDT:USDT"
    timeframe: "5m"
  - symbol: "BTC/USDT:USDT"
    timeframe: "30m"

strategies:
  - name: liquidity_pinbars
    enabled: true
    params:
      ema_length: 9
      body_size_ratio: 0.3
      wick_ratio: 2.0

alerts:
  telegram:
    bot_token: "PLACEHOLDER_TOKEN"
    chat_id: "PLACEHOLDER_CHAT_ID"

polling:
  interval_seconds: 5
  lookback_bars: 200
